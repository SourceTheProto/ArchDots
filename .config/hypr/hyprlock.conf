general {
	compositor_fade = false
	fail_timeout = 2000
	ignore_empty_input = true
}

background {
	monitor =
	path =
	blur_passes = 2
	blur_size = 70
	color = rgba(0, 0, 0, 0.0)
}

animations {
	enabled = true
	bezier = linear, 1, 1, 0, 0
	animation = fadeIn, 1, 5, linear
	animation = fadeOut, 1, 5, linear
}

label {
	monitor = HDMI-A-1
	text = $TIME12
	font_size = 45
	font_family = DejaVuSerif
}

input-field {
	monitor = HDMI-A-1
	size = 8%, 5%
	position = 0, -100
	rounding = 15

	check_text = Authenticating...

	invert_numlock = true
	numlock_color = rgba(252, 241, 40, 1.0)
	check_color = rgba(59, 165, 255, 1.0)
	fail_color = rgba(180, 80, 80, 1.0)
}
